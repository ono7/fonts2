[buildPlans.IosevkaCustomV3]
family = "Iosevka Custom"
spacing = "fixed"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
noLigation = true
# if we leave this out this will generate the correct fonts for macos/linux/windows
hinting = "none"

[buildPlans.IosevkaCustomV3.variants]
inherits = "ss09"

[buildPlans.IosevkaCustomV3.variants.design]
zero = "tall-reverse-slashed"
one = "base-long-top-serif"
four = "semi-open-non-crossing-serifless"
capital-k = "symmetric-touching-serifless"
a = "single-storey-earless-corner-tailed"
b = "toothless-corner-serifless"
c = "serifless"
d = "toothless-corner-serifless"
e = "flat-crossbar"
f = "flat-hook-serifless"
g = "single-storey-earless-corner"
i = "serifed-diagonal-tailed"
j = "serifed"
k = "symmetric-connected-serifless"
l = "tailed-serifed"
m = "earless-rounded-double-arch-serifless"
n = "earless-corner-straight-serifless"
p = "earless-corner-serifless"
q = "earless-corner-straight-serifless"
r = "earless-corner-serifless"
s = "serifless"
t = "bent-hook"
u = "toothless-rounded-serifless"
v = "straight-serifless"
y = "straight-turn-serifless"
w = "straight-serifless"

paren = "normal"
brace = "straight"
number-sign = "upright"
ampersand = "upper-open"
dollar = "through"
percent = "rings-continuous-slash"
bar = "force-upright"

[buildPlans.IosevkaCustomV3.variants.italic]
zero = "tall-reverse-slashed"
e = "rounded"
i = "tailed-serifed"
k = "cursive-bottom-right-serifed"
l = "tailed-serifed"
s = "serifless"
t = "bent-hook"
y = "cursive-flat-hook-serifless"
u = "toothless-rounded-serifless"
v = "straight-serifless"
w = "straight-serifless"

[buildPlans.IosevkaCustomV3.weights.Regular]
# shape = 400 - this is the normal size
# shape = 700 - this is bold and was my favourite but tone it down to 650
shape = 720
menu = 400
css = 400

[buildPlans.IosevkaCustomV3.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.IosevkaCustomV3.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaCustomV3.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

[buildPlans.IosevkaCustomV3.metricOverride]
leading = 1150
winMetricAscenderPad = 0
winMetricDescenderPad = 0
